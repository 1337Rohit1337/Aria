apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aria-frontend
  template:
    metadata:
      labels:
        app: aria-frontend
    spec:
      containers:
        - name: frontend
          image: aria-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aria-frontend
spec:
  ports:
    - port: 80
  selector:
    app: aria-frontend